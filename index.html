    <script>
      // Tema por defecto: claro. Respeta la elección guardada del usuario.
      (function () {
        try {
          var t = localStorage.getItem("bogey-theme") || "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
